name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # Tests run third-party dev dependencies, so this job only gets a read-only token.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json and in-game version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          GAMEV=$(grep -oP "GAME_VERSION = '\K[^']+" js/game.js)
          echo "tag=$TAG package=$PKG game=$GAMEV"
          test "$TAG" = "$PKG" && test "$TAG" = "$GAMEV"

      - run: npm ci
      - run: npm run lint
      - run: npm run validate
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Build playable zip
        run: |
          NAME="pichonkun-${GITHUB_REF_NAME}"
          mkdir -p "dist/$NAME"
          cp -r index.html style.css favicon.png js README.md LICENSE CHANGELOG.md "dist/$NAME/"
          (cd dist && zip -qr "$NAME.zip" "$NAME")

      - name: Extract release notes from CHANGELOG.md
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          printf '\n**Play online:** https://%s.github.io/%s/\n' "${GITHUB_REPOSITORY_OWNER}" "${GITHUB_REPOSITORY#*/}" >> notes.md
          cat notes.md
          mv notes.md dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release
          path: |
            dist/*.zip
            dist/notes.md
          if-no-files-found: error

  # Publishing is the only step that can write to the repository, and it runs no project code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "pichonkun-${GITHUB_REF_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" --title "Pichonkun ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
