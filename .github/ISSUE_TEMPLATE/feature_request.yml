name: Idea / feature request
description: Suggest a level, enemy, riddle or feature
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it make the game better?
  - type: checkboxes
    id: roadmap
    attributes:
      label: Checks
      options:
        - label: I checked ROADMAP.md and the existing issues.
