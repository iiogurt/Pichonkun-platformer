<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pichonkun and the Clean Air Adventure</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="description" content="Pichonkun and the Clean Air Adventure: a 10-level pixel-art platformer about clean air, air conditioning and ecology.">
<meta name="theme-color" content="#0d1b5e">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">PAINTING PIXELS...</div>
<div id="touch">
  <div class="pad left">
    <button data-a="left">◀</button>
    <button data-a="up">▲</button>
    <button data-a="right">▶</button>
  </div>
  <div class="pad right">
    <button data-a="shoot" class="b">SHOOT</button>
    <button data-a="jump" class="a">JUMP</button>
  </div>
  <button data-a="pause" class="pause">II</button>
</div>
<script src="js/font.js"></script>
<script src="js/gfx.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/levels.js"></script>
<script src="js/terrain.js"></script>
<script src="js/backdrops.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
